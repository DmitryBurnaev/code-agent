services:
  app:
    container_name: code-agent-app
    image: ${DOCKER_IMAGE:-code-agent}
    build:
      context: .
      target: "service"
    ports:
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    env_file:
      - .env
    environment:
      APP_SERVICE: app
      DB_HOST: ${DB_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    profiles: [local-storage, test]
    container_name: code-agent-db
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - ${PWD}/.data/postgres:/var/lib/postgresql/data/pgdata

  test:
    profiles: [test]
    container_name: code-agent-test
    image: ${TEST_DOCKER_IMAGE:-code-agent:test}
    env_file:
      - .env
    build:
      context: .
      target: tests
      args:
        DEV_DEPS: true
    environment:
      APP_SERVICE: test
      DB_HOST: db
      TEST_POSTGRES_MIGRATIONS: "1"
      E2E_POSTGRES_HOST: db
      E2E_POSTGRES_PORT: "5432"
      E2E_POSTGRES_USER: ${DB_USER}
      E2E_POSTGRES_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  lint:
    profiles: [lint]
    container_name: code-agent-lint
    image: ${TEST_DOCKER_IMAGE:-code-agent:test}
    env_file:
      - .env
    build:
      context: .
      target: tests
      args:
        DEV_DEPS: true
    environment:
      APP_SERVICE: lint
