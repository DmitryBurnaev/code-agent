[project]
name = "code-agent"
version = "0.1.0"
description = "Code Agent (some helper system)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.139.2",
    "itsdangerous==2.2.0",         # required by session engine
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx[socks]==0.28.1",
    "sqlalchemy[asyncio]==2.0.51",
    "sqladmin==0.29.0",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "pyjwt==2.13.0",
    "pycryptodomex==3.23.0",       # for API key encryptions
    "uvloop==0.22.1",
]

[dependency-groups]
dev = [
    "types-wtforms==3.2.1.20260518",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0", # were >=0.26.0,<0.27"
    "coverage==7.15.2",
    "black==26.5.1",
    "ruff==0.15.22",
    "mypy==2.3.0",
    # pycharm requires:
    "setuptools==83.0.0",
    "pip==26.1.2",
]

# === Ruff settings ===
[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "venv",
    ".idea/",
]

# Same as Black.
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

# === Other tools settings settings ===

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
strict = true
exclude = ["src/tests", "src/migrations", ".local", "test_*"]

[[tool.mypy.overrides]]
module = ["src.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["src.tests", "src.tests.*"]
follow_imports = "skip"
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_return_any = false
implicit_reexport = true
strict_equality = false
extra_checks = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_also = [
    # Regexes for lines to exclude from consideration
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/cli/*", "src/tests/*", "src/migrations/*"]
