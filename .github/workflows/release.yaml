name: Release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}
  # DEBUG_DOCKER_IMAGE_TAG: 0.1.5-debug

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.names.outputs.image_tag }}
      image_name_base: ${{ steps.names.outputs.image_name_base }}
      image_name_full: ${{ steps.names.outputs.image_name_full }}
      image_name_latest: ${{ steps.names.outputs.image_name_latest }}

    steps:
      - name: Prepare names
        id: names
        run: |
          REPOSITORY_NAME=$(basename "${{ github.repository }}")
          IMAGE_NAME_LOWERCASED=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
          else
            IMAGE_TAG="${{ env.DEBUG_DOCKER_IMAGE_TAG }}"
          fi
          # Remove leading 'v' from tag if present (e.g., v1.2.3 -> 1.2.3)
          if [[ "${IMAGE_TAG}" == v* ]]; then
            IMAGE_TAG="${IMAGE_TAG#v}"
          fi
          IMAGE_NAME_BASE="${{ env.REGISTRY }}/${IMAGE_NAME_LOWERCASED}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_name_base=${IMAGE_NAME_BASE}" >> $GITHUB_OUTPUT
          echo "image_name_full=${IMAGE_NAME_BASE}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_name_latest=${IMAGE_NAME_BASE}:latest" >> $GITHUB_OUTPUT
          echo "==="
          echo "${IMAGE_NAME_BASE}"
          echo "${IMAGE_NAME_BASE}:${IMAGE_TAG}"
          echo "==="
          echo "gh-output:"
          echo $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
          echo "==="

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env file
        run: |
          cp .env.template .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "APP_SECRET_KEY=test" >> .env
          echo "VENDOR_ENCRYPTION_KEY=test" >> .env
          echo "ADMIN_PASSWORD=test" >> .env
          env >> .env

      - name: Build image
        run: docker compose build test

      - name: Run tests
        run: docker compose up --exit-code-from test test

      - name: Run API e2e tests
        run: make test-e2e-in-docker

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for docker image
        id: docker-image-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image_name_base }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.image_tag }}

      - name: Debug metadata
        run: |
          echo "Image tag: ${{ needs.prepare.outputs.image_tag }}"
          echo "Image name base: ${{ needs.prepare.outputs.image_name_base }}"
          echo "Image name full: ${{ needs.prepare.outputs.image_name_full }}"
          echo "Image name latest: ${{ needs.prepare.outputs.image_name_latest }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Generated tags:"
          echo "${{ steps.docker-image-meta.outputs.tags }}"
          echo "Generated labels:"
          echo "${{ steps.docker-image-meta.outputs.labels }}"

      - name: Build and push Docker image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: service
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image_name_base }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.docker-image-meta.outputs.labels }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "$DIGEST" > "${RUNNER_TEMP}/digests/${ARCH}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch index
        env:
          IMAGE_NAME_BASE: ${{ needs.prepare.outputs.image_name_base }}
          IMAGE_NAME_FULL: ${{ needs.prepare.outputs.image_name_full }}
          IMAGE_NAME_LATEST: ${{ needs.prepare.outputs.image_name_latest }}
        run: |
          images=()
          for arch in amd64 arm64; do
            read -r digest < "${RUNNER_TEMP}/digests/${arch}"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid image digest for ${arch}" >&2
              exit 1
            fi
            images+=("${IMAGE_NAME_BASE}@${digest}")
          done
          docker buildx imagetools create \
            --tag "$IMAGE_NAME_FULL" \
            --tag "$IMAGE_NAME_LATEST" \
            --annotation "index:org.opencontainers.image.description=A configurable proxy application for routing and managing requests across multiple LLM vendors." \
            "${images[@]}"

  verify:
    needs: [prepare, merge]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify docker images
        run: |
          verify_platforms() {
            docker_image="$1"
            echo "Checking platforms for ${docker_image}"
            docker buildx imagetools inspect --raw "${docker_image}" |
              jq -e '
                [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
                | index("amd64") != null and index("arm64") != null
              '
            echo "✓ Image ${docker_image} contains linux/amd64 and linux/arm64"
          }

          verify_platforms "${{ needs.prepare.outputs.image_name_full }}"
          verify_platforms "${{ needs.prepare.outputs.image_name_latest }}"

  create-release:
    needs: [prepare, merge, verify]
    runs-on: ubuntu-latest
    # Only create release when pushing a tag
    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release-meta
        run: |
          DOCKER_IMAGE="${{ needs.prepare.outputs.image_name_full }}"
          DOCKER_IMAGE_LATEST="${{ needs.prepare.outputs.image_name_latest }}"
          DOCKER_IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"

          # Create metadata file
          cat > release-metadata.json << EOF
          {
            "version": "${DOCKER_IMAGE_TAG}",
            "docker_image": "${DOCKER_IMAGE}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # Prepare release body
          cat > release-body.md << EOF
          ## Released Image Version ${DOCKER_IMAGE_TAG}

          **Image Versioned:** \`${DOCKER_IMAGE}\`
          **Image Latest:** \`${DOCKER_IMAGE_LATEST}\`
          **Pull command:**
          \`\`\`bash
          docker pull ${DOCKER_IMAGE}
          \`\`\`
          EOF

          echo "metadata_file=release-metadata.json" >> $GITHUB_OUTPUT
          echo "body_file=release-body.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.image_tag }}
          name: ${{ needs.prepare.outputs.image_tag }}
          body_path: ${{ steps.release-meta.outputs.body_file }}
          files: ${{ steps.release-meta.outputs.metadata_file }}
          draft: false
          append_body: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
