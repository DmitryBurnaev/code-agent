name: Scan

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "main"
      - "feature/58-trivy-security-scans" # Temporary: verify scans in CI before merge.
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00

env:
  OPENGREP_VERSION: "v1.33.1"
  TRUFFLEHOG_VERSION: "v3.90.12"
  GITLEAKS_VERSION: "v8.28.0"

jobs:
  trivy:
    name: trivy-${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [image, fs]
    env:
      TRIVY_VERSION: "0.76.2"
      TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM,LOW"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      - name: Build service image
        if: matrix.target == 'image'
        run: |
          docker build --platform linux/amd64 --target service \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "code-agent:scan-${GITHUB_SHA}" .
          image_id=$(docker image inspect "code-agent:scan-${GITHUB_SHA}" --format '{{.Id}}')
          docker image inspect "$image_id" --format 'ID={{.Id}} OS={{.Os}} Arch={{.Architecture}} Revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Scan image
        if: matrix.target == 'image'
        run: |
          "$RUNNER_TEMP/trivy" image --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --config "" --ignorefile "" --ignore-policy .github/scan/trivy-image-ignore.rego --image-src docker --scanners vuln \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed=false --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-image.json" "$IMAGE_ID"

      - name: Scan filesystem
        if: matrix.target == 'fs'
        run: |
          "$RUNNER_TEMP/trivy" fs --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --config "" --ignorefile "" --skip-check-update --scanners vuln,misconfig --include-dev-deps \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed=false --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-fs.json" .

      - name: Validate report
        env:
          TARGET: ${{ matrix.target }}
        run: |
          report="$RUNNER_TEMP/trivy-$TARGET.json"
          jq -e 'type == "object" and .SchemaVersion == 2 and (.Results | type == "array")' "$report" > /dev/null
          if [ "$TARGET" = image ]; then
            jq -e --arg image_id "$IMAGE_ID" --arg revision "$GITHUB_SHA" \
              '.ArtifactType == "container_image" and .Metadata.ImageID == $image_id and
               .Metadata.ImageConfig.architecture == "amd64" and
               .Metadata.ImageConfig.config.Labels["org.opencontainers.image.revision"] == $revision' "$report" > /dev/null
          else
            jq -e 'any(.Results[]; .Type == "uv" and .Target == "uv.lock") and
              any(.Results[]; .Type == "dockerfile" and .Target == "Dockerfile")' "$report" > /dev/null
          fi

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-${{ matrix.target }}
          path: ${{ runner.temp }}/trivy-${{ matrix.target }}.json
          retention-days: 60
          if-no-files-found: error

      - name: Fail on findings
        run: |
          "$RUNNER_TEMP/trivy" convert --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --config "" --ignorefile "" --scanners vuln,misconfig \
            --severity "$TRIVY_SEVERITY" --exit-code 1 --format table "$RUNNER_TEMP/trivy-${{ matrix.target }}.json"

  trufflehog:
    if: github.event_name != 'pull_request'
    name: trufflehog
    runs-on: ubuntu-24.04
    steps:

      - name: Install Trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin ${{ env.TRUFFLEHOG_VERSION }}

      - uses: actions/checkout@v5

      - name: Run Trufflehog FS (report)
        run: |
          trufflehog filesystem "${{ github.workspace }}" --results=verified,unknown --json > "${{ runner.temp }}/trufflehog-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: trufflehog-results
          path: "${{ runner.temp }}/trufflehog-results.json"
          retention-days: 60

      - name: Run Trufflehog FS (alert)
        run: |
          trufflehog filesystem "${{ github.workspace }}" --results=verified,unknown --fail --github-actions

  gitleaks:
    if: github.event_name != 'pull_request'
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:

      - name: Install GitLeaks
        run: |
          git clone --branch ${{ env.GITLEAKS_VERSION }} https://github.com/gitleaks/gitleaks.git /home/runner/.gitleaks
          cd /home/runner/.gitleaks
          make build
          pwd
          ls -lah

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for better secret detection

      - name: Run Gitleaks (report)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --redact --gitleaks-ignore-path .github/scan/gitleaks-ignore.txt --exit-code 0 --report-format json --report-path "${{ runner.temp }}/gitleaks-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-results
          path: "${{ runner.temp }}/gitleaks-results.json"
          retention-days: 60

      - name: Run Gitleaks (alert)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --redact --gitleaks-ignore-path .github/scan/gitleaks-ignore.txt --verbose

  opengrep:
    if: github.event_name != 'pull_request'
    name: opengrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh  | bash -s -- -v ${{ env.OPENGREP_VERSION }}

      - name: Clone Opengrep Rules
        run: |
          git clone https://github.com/opengrep/opengrep-rules.git

      - name: Run Opengrep Scan (report)
        run: |
          export PATH='/home/runner/.opengrep/cli/latest':$PATH
          # These two syntax heuristics misidentify typed attributes and valid lambdas.
          # Ruff and mypy cover the underlying Python errors; keep all security rules.
          opengrep scan --config opengrep-rules/python --no-rewrite-rule-ids --exclude-rule is-function-without-parentheses --exclude-rule return-not-in-function --json -o "${{ runner.temp }}/opengrep-results.json" .

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: opengrep-results
          path: "${{ runner.temp }}/opengrep-results.json"
          retention-days: 60

      - name: Run Opengrep Scan (alert)
        run: |
          export PATH='/home/runner/.opengrep/cli/latest':$PATH
          opengrep scan --config opengrep-rules/python --no-rewrite-rule-ids --exclude-rule is-function-without-parentheses --exclude-rule return-not-in-function --strict --error .
