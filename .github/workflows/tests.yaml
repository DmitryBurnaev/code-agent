name: Test
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env file
        run: |
          cp .env.template .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "APP_SECRET_KEY=test" >> .env
          echo "VENDOR_ENCRYPTION_KEY=test" >> .env
          echo "ADMIN_PASSWORD=test" >> .env
          env >> .env

      - name: Build images
        run: |
          docker compose build test

      - name: Run linters
        run: docker compose up --exit-code-from lint lint

      - name: Run tests
        run: docker compose up --exit-code-from test test

  arm64-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env file
        run: |
          cp .env.template .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "APP_SECRET_KEY=test" >> .env
          echo "VENDOR_ENCRYPTION_KEY=test" >> .env
          echo "ADMIN_PASSWORD=test" >> .env
          env >> .env

      - name: Build ARM64 images
        run: make build-arm64

      - name: Run ARM64 tests
        run: >
          DOCKER_DEFAULT_PLATFORM=linux/arm64
          DOCKER_IMAGE=code-agent:arm64
          TEST_DOCKER_IMAGE=code-agent:test-arm64
          docker compose up --no-build --exit-code-from test test
